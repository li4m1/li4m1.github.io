<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JANSSON TV</title>
  <meta name="description" content="JANSSON TELEVISION — a CRT set broadcasting the archive live. No pause, no scrubber. You tune, you surf.">
  <meta property="og:title" content="JANSSON TV">
  <meta property="og:description" content="A television station, not a video page. Boom bap on CH 03, pirate feed on CH 07. Broadcasting now.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="channels.js?v=1" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>

<a class="home" href="https://janssonliam.de/" aria-label="Back to janssonliam.de">
  <img src="/crown.png" alt="">JANSSON
</a>

<div class="room">
  <div class="ghost" aria-hidden="true">JANSSON</div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <div class="set" id="tv">
    <img class="set-photo" src="tv-set.jpg?v=1" alt="" draggable="false">
    <div class="screen" id="screen">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="noise" width="160" height="120" aria-hidden="true"></canvas>

        <!-- test card / ident cards (populated by app.js) -->
        <div class="card" id="card" hidden></div>

        <!-- CRT stack -->
        <div class="fx fx-mask" aria-hidden="true"></div>
        <div class="fx fx-scan" aria-hidden="true"></div>
        <div class="fx fx-roll" aria-hidden="true"></div>
        <div class="fx fx-flicker" aria-hidden="true"></div>
        <div class="fx fx-vignette" aria-hidden="true"></div>

        <!-- OSD (drawn by the TV, under the glass) -->
        <div class="osd" aria-live="polite">
          <div class="osd-ch" id="osdCh" hidden>
            <span class="osd-num" id="osdNum"></span>
            <span class="osd-name" id="osdName"></span>
          </div>
          <div class="osd-pause" id="osdPause" hidden>❚❚ PAUSE</div>
          <div class="osd-mute" id="osdMute" hidden>MUTE</div>
          <div class="lower3" id="lower3" hidden>
            <div class="l3-artist" id="l3Artist"></div>
            <div class="l3-title" id="l3Title"></div>
            <div class="l3-meta" id="l3Meta"></div>
            <div class="l3-station"></div>
          </div>
          <div class="osd-hint" id="osdHint" hidden></div>
        </div>

        <div class="fx fx-glass" aria-hidden="true"></div>
        <div class="boot" id="boot" aria-hidden="true"></div>
        <div class="screen-off" id="screenOff" aria-hidden="true">
          <svg class="jtv-badge" viewBox="0 0 364 322">
            <defs>
              <filter id="spray" x="-15%" y="-15%" width="130%" height="130%">
                <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="11" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
              </filter>
              <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
            </defs>
            <path d="M15,15 L305,15 L305,180 Q305,285 160,285 Q15,285 15,180 L15,140 L95,140 L95,180 Q95,205 160,205 Q225,205 225,180 L225,95 L15,95 Z" transform="translate(14,14)" fill="#2B0A72"/>
            <path d="M15,15 L305,15 L305,180 Q305,285 160,285 Q15,285 15,180 L15,140 L95,140 L95,180 Q95,205 160,205 Q225,205 225,180 L225,95 L15,95 Z" fill="#6C1ADB" stroke="#140933" stroke-width="4"/>
            <g fill="#F0B429" filter="url(#soft)" opacity=".5">
              <circle cx="196" cy="212" r="3"/><circle cx="341" cy="236" r="2.5"/>
              <circle cx="230" cy="304" r="3.5"/><circle cx="322" cy="300" r="2"/>
              <circle cx="205" cy="292" r="2"/><circle cx="348" cy="270" r="3"/>
            </g>
            <g filter="url(#spray)">
              <text x="330" y="292" text-anchor="end" font-family="Captions" font-size="164" fill="#F0B429" transform="rotate(-5 255 255)">TV</text>
            </g>
          </svg>
        </div>
      </div>
  </div>

  <p class="hint" id="startHint">PRESS <b>⏻ POWER</b> — BROADCASTING NOW</p>

  <div class="dock">
    <button class="dbtn power" id="btnPower" aria-label="Power">
      <span class="led" id="led"></span>⏻
    </button>
    <span class="dsep" aria-hidden="true"></span>
    <button class="dbtn" id="btnChUp"  aria-label="Channel up">CH ▲</button>
    <button class="dbtn" id="btnChDn"  aria-label="Channel down">CH ▼</button>
    <span class="dsep" aria-hidden="true"></span>
    <button class="dbtn" id="btnPause" aria-label="Pause">⏸ PAUSE</button>
    <button class="dbtn" id="btnSkip"  aria-label="Skip to next video">SKIP ⏭</button>
    <span class="dsep" aria-hidden="true"></span>
    <button class="dbtn" id="btnGuide" aria-label="TV guide">GUIDE</button>
  </div>
</div>

<!-- TV guide overlay -->
<div class="guide" id="guide" hidden role="dialog" aria-label="TV guide">
  <div class="g-head">
    <span class="g-title">TV GUIDE</span>
    <span class="g-clock" id="gClock"></span>
    <button class="g-close" id="gClose" aria-label="Close guide">✕</button>
  </div>
  <div class="g-grid" id="gGrid"></div>
  <div class="g-foot">
    <span>JANSSON TELEVISION — BROADCASTING FROM BERLIN</span>
    <span class="g-legal">
      <a href="/impressum.html">IMPRESSUM</a> · <a href="/datenschutz.html">DATENSCHUTZ</a>
    </span>
  </div>
</div>

</body>
</html>
