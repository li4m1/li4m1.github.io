<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>INSPO · creative second brain</title>
  <meta name="description" content="Everything that inspired me, in one navigable space. Films, photos, books, music, design, words.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧷</text></svg>">
  <link rel="preload" href="/Captions.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=15">
  <script src="app.js?v=15" defer></script>
</head>
<body>

<header>
  <a class="home" href="https://janssonliam.de/" aria-label="Back to janssonliam.de">
    <img src="/crown.png" alt="">JANSSON
  </a>
  <div class="brand">INSPO</div>
  <button class="btn gold" id="addBtn" type="button">+ Add</button>
  <button class="btn" id="railToggle" type="button" aria-expanded="true">Map</button>
</header>

<nav id="rail" aria-label="Categories"></nav>

<div id="space">
  <div id="camera"></div>
</div>

<div id="hud" class="mono" aria-live="polite"></div>

<div id="add" hidden>
  <div class="focus-card add-card">
    <div class="focus-info" style="flex:1">
      <span class="focus-path mono">Add to the planet</span>
      <input id="addInput" type="text" placeholder="Paste a link, or write a thought…" autocomplete="off" spellcheck="false">
      <div class="add-row">
        <button class="btn" id="addFile" type="button">Or choose an image</button>
        <span class="mono" id="addFileName"></span>
      </div>
      <div class="add-row">
        <select id="addCat"></select>
        <input id="addSub" list="subList" placeholder="subcategory…" autocomplete="off" spellcheck="false"><datalist id="subList"></datalist>
      </div>
      <button class="btn gold" id="addGo" type="button">Pin it</button>
    </div>
    <button class="focus-close" id="addClose" aria-label="Close">✕</button>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div id="focus" hidden>
  <div class="focus-card">
    <div class="focus-art" id="focusArt"></div>
    <div class="focus-info">
      <span class="focus-path mono" id="focusPath"></span>
      <h2 id="focusTitle"></h2>
      <p id="focusMeta"></p>
      <p class="focus-note mono">placeholder · will link to the source</p>
    </div>
    <button class="focus-close" id="focusClose" aria-label="Close">✕</button>
  </div>
</div>

<footer class="hints mono" aria-hidden="true">
  scroll: fly through · drag: pan · drop images or paste links anywhere: quick-pin · esc: back
</footer>

<nav class="legal">
  <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a>
</nav>

</body>
</html>
